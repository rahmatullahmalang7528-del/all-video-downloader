<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>ویڈیو ڈاؤنلوڈر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#0F1E2E;--panel:#172B40;--line:#274562;--ink:#F3F6F9;--mute:#97A9BC;--gold:#FFB020;--err:#FF7A7A;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#EEF3F7;--panel:#fff;--line:#CFDAE5;--ink:#10202F;--mute:#5B6E82;--gold:#C77700;--err:#C42B2B;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.9}
body{padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:auto;min-height:100vh}
h1{font-size:30px;margin:28px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 22px}
.bar{display:flex;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.bar:focus-within{border-color:var(--gold)}
input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;padding:6px 10px;direction:ltr;text-align:left;outline:0}
button{font:inherit;cursor:pointer;border:0}
.paste{background:var(--gold);color:#1a1200;font-weight:700;border-radius:11px;padding:6px 16px}
.paste:focus-visible,.chip:focus-visible,.dl:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:30px;margin:10px 4px;color:var(--mute)}
.msg.err{color:var(--err)}
.card{display:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.card.on{animation:none}}
video{width:100%;max-height:60vh;background:#000;display:block}
.meta{padding:14px 16px 4px}
.meta b{display:block;font-size:17px;line-height:1.7}
.meta span{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.chip{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dl{display:block;width:calc(100% - 32px);margin:6px 16px 16px;padding:12px;background:var(--gold);color:#1a1200;border-radius:14px;font-size:18px;font-weight:700;position:relative;overflow:hidden}
.dl[disabled]{opacity:.85;cursor:progress}
.dl i{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.18);width:0}
.dl span{position:relative}
.note{color:var(--mute);font-size:13px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<h1>ویڈیو ڈاؤنلوڈر</h1>
<p class="sub">لنک پیسٹ کریں، ویڈیو دیکھیں، گیلری میں محفوظ کریں۔</p>
<div class="bar">
  <input id="u" type="url" inputmode="url" placeholder="https://..." aria-label="ویڈیو کا لنک" autocomplete="off">
  <button class="paste" id="pb">پیسٹ</button>
</div>
<div class="msg" id="m" role="status" aria-live="polite"></div>
<section class="card" id="c">
  <video id="v" controls playsinline preload="metadata"></video>
  <div class="meta"><b id="t"></b><span id="s"></span></div>
  <div class="chips" id="q" role="group" aria-label="کوالٹی"></div>
  <button class="dl" id="d"><i id="p"></i><span id="dt">گیلری میں محفوظ کریں</span></button>
</section>
<p class="note">صرف وہ ویڈیوز ڈاؤنلوڈ کریں جن کے آپ مالک ہیں یا جن کی اجازت ہے۔</p>
<script>
const $=i=>document.getElementById(i);
const API=(localStorage.getItem('api')||'')+'/api';
let height=0,link='';
const say=(t,e)=>{$('m').textContent=t;$('m').className='msg'+(e?' err':'')};
const fmtDur=s=>s?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';

async function load(){
  link=$('u').value.trim();
  if(!/^https?:\/\//i.test(link)){say('درست لنک پیسٹ کریں (https سے شروع ہو)',1);return}
  $('c').classList.remove('on');say('ویڈیو تلاش ہو رہی ہے…');
  try{
    const r=await fetch(API+'/info?url='+encodeURIComponent(link));
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'خرابی');
    $('t').textContent=d.title||'ویڈیو';
    $('s').textContent=[d.site,d.uploader,fmtDur(d.duration)].filter(Boolean).join(' • ');
    const v=$('v');v.poster=d.thumbnail||'';v.removeAttribute('src');
    if(d.preview_url){v.src=d.preview_url;v.onerror=()=>{v.removeAttribute('src');v.load()}}
    const q=$('q');q.innerHTML='';height=0;
    const opts=[[0,'اصل / بہترین'],...d.heights.slice(0,5).map(h=>[h,h+'p'])];
    opts.forEach(([h,l],i)=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.style.minHeight='44px';b.setAttribute('aria-pressed',i==0);b.onclick=()=>{height=h;[...q.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};q.appendChild(b)});
    $('c').classList.add('on');say('');
  }catch(e){say(e.message.includes('Failed')?'سرور سے رابطہ نہیں ہو سکا':e.message,1)}
}

async function save(){
  const b=$('d');b.disabled=true;$('dt').textContent='ڈاؤنلوڈ ہو رہا ہے…';$('p').style.width='0';
  try{
    const r=await fetch(API+'/download?height='+height+'&url='+encodeURIComponent(link));
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||'ڈاؤنلوڈ ناکام')}
    const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(total)$('p').style.width=(got/total*100)+'%'}
    const file=new File(parts,'video-'+Date.now()+'.mp4',{type:'video/mp4'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});say('شیئر شیٹ سے "ویڈیو محفوظ کریں" یا گیلری چنیں')}catch(_){say('محفوظ کرنا منسوخ ہوا')}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();say('ویڈیو ڈاؤنلوڈ ہو گئی')
    }
  }catch(e){say(e.message,1)}
  b.disabled=false;$('dt').textContent='گیلری میں محفوظ کریں';$('p').style.width='0';
}
$('pb').onclick=async()=>{try{$('u').value=await navigator.clipboard.readText()}catch(_){$('u').focus();return}load()};
$('u').addEventListener('input',()=>{if(/^https?:\/\/\S+$/i.test($('u').value.trim()))load()});
$('u').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
$('d').onclick=save;
</script>
</body>
</html>
